version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: honeytravel-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
    networks:
      - honeytravel
    depends_on:
      - pgsql
      - redis

  nginx:
    image: nginx:1.25-alpine
    container_name: honeytravel-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - honeytravel
    depends_on:
      - app

  pgsql:
    image: postgres:15-alpine
    container_name: honeytravel-pgsql
    restart: unless-stopped
    environment:
      POSTGRES_DB: honeytravel
      POSTGRES_USER: honeytravel
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    networks:
      - honeytravel

  redis:
    image: redis:7-alpine
    container_name: honeytravel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - honeytravel

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: honeytravel-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - .:/var/www
    networks:
      - honeytravel
    depends_on:
      - app
      - pgsql
      - redis

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: honeytravel-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - .:/var/www
    networks:
      - honeytravel
    depends_on:
      - app
      - pgsql
      - redis

networks:
  honeytravel:
    driver: bridge

volumes:
  pgsql-data:
    driver: local
  redis-data:
    driver: local
